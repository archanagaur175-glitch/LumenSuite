[package]
name = "lumensuite"
version = "0.1.0"
description = "Lumen Suite — local-first, privacy-first office suite (Writer, Calc, Impress)"
authors = ["Lumen Suite contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/archanagaur175-glitch/LumenSuite"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lumensuite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5" }
tauri-plugin-log = "2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
parking_lot = "0.12"
once_cell = "1.20"