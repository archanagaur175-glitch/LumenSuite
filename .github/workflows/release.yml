name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Frontend build
        run: |
          npm ci
          npm run build

      - name: Fetch bundled LibreOffice runtime
        run: npm run fetch:lo
        env:
          LO_VERSION: "26.2.5"

      - name: Prune runtime to minimal convert set
        run: npm run package:lo

      - name: Smoke-test engine conversion
        run: npm run smoke:convert

      - name: Run CI checks (frontend + Rust)
        run: |
          npm run typecheck
          npm run lint
          cd src-tauri && cargo clippy --all-targets -- -D warnings && cd ..

      - name: Build release bundle
        shell: bash
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List artifacts
        shell: bash
        run: |
          ls -lh src-tauri/target/release/bundle/
          find . -name "*.msi" -o -name "*.exe" | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumen-suite-windows
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lumen Suite ${{ github.ref_name }}
          body: |
            Local-first, ad-free, private office suite (Writer / Calc / Impress).

            **Engine:** bundled LibreOffice 26.2.5
            **License:** GPL-3.0-or-later

            > This is an automated build. The Windows installer is unsigned; SmartScreen may
            > warn until the binary is trusted.
          files: |
            artifacts/**/*
          generate_release_notes: true